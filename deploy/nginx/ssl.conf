server {
    listen 80;
    server_name parent-ease.web.id www.parent-ease.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name parent-ease.web.id www.parent-ease.web.id;

    ssl_certificate /etc/letsencrypt/live/parent-ease.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parent-ease.web.id/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ParentEaseSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    location = /scalar {
        proxy_pass http://api:8000;
    }

    location = /mcp/health {
        proxy_pass http://mcp:8001/health;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
