<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <title>ParentEase AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: #ede9fe;
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --text:         #1e293b;
      --muted:        #64748b;
      --danger:       #ef4444;
      --green:        #22c55e;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: var(--primary);
      border-radius: 11px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .logo svg { width: 20px; height: 20px; }

    .brand      { font-size: 0.975rem; font-weight: 600; letter-spacing: -0.01em; }
    .brand-sub  { font-size: 0.72rem;  color: var(--muted); margin-top: 1px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2.5px #dcfce7;
    }

    /* ── Messages area ──────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar        { width: 4px; }
    .messages::-webkit-scrollbar-track  { background: transparent; }
    .messages::-webkit-scrollbar-thumb  { background: var(--border); border-radius: 4px; }

    /* ── Empty state ────────────────────────────────────────── */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 32px 24px;
      pointer-events: none;
      color: var(--muted);
      animation: fadein 0.4s ease;
    }

    .empty-icon {
      width: 58px; height: 58px;
      background: var(--primary-soft);
      border-radius: 18px;
      display: grid;
      place-items: center;
    }

    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-top: 4px; }
    .empty-sub   { font-size: 0.82rem; max-width: 270px; line-height: 1.5; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
      pointer-events: all;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: inherit;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* ── Message rows ───────────────────────────────────────── */
    .row {
      display: flex;
      gap: 9px;
      align-items: flex-end;
      max-width: 680px;
      width: 100%;
      animation: fadein 0.25s ease;
    }

    .row.user { margin-left: auto; flex-direction: row-reverse; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 29px; height: 29px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      user-select: none;
    }

    .avatar.ai   { background: var(--primary-soft); color: var(--primary); }
    .avatar.user { background: #dbeafe; color: #2563eb; font-size: 12px; font-weight: 600; }

    .wrap { display: flex; flex-direction: column; gap: 3px; max-width: calc(100% - 38px); }
    .row.user .wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 17px;
      line-height: 1.65;
      font-size: 0.875rem;
      word-break: break-word;
    }

    .ai-bubble {
      background: var(--surface);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .user-bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .ts {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 3px;
    }

    /* AI bubble rich text */
    .ai-bubble p + p   { margin-top: 7px; }
    .ai-bubble hr      { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .ai-bubble ul      { padding-left: 18px; margin-top: 4px; }
    .ai-bubble li + li { margin-top: 3px; }
    .ai-bubble strong  { font-weight: 600; }

    /* ── Source attribution ─────────────────────────────────── */
    .sources {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 2px;
    }

    .source-label {
      font-size: 0.68rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .source-chip svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* ── Typing indicator ───────────────────────────────────── */
    .typing-bubble {
      background: var(--surface);
      border-radius: 17px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      padding: 13px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #cbd5e1;
      animation: bounce 1.3s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);   background: #cbd5e1; }
      30%           { transform: translateY(-7px); background: var(--primary); }
    }

    /* ── Input area ─────────────────────────────────────────── */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .input-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .input-shell {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      transition: border-color 0.15s, background 0.15s;
    }

    .input-shell:focus-within {
      border-color: var(--primary);
      background: #fff;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text);
      line-height: 1.55;
      padding: 10px 13px;
      max-height: 130px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    textarea::placeholder { color: #94a3b8; }

    .send-btn {
      width: 40px; height: 40px;
      background: var(--primary);
      border: none;
      border-radius: 11px;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }

    .send-btn:hover:not(:disabled)  { background: var(--primary-dark); }
    .send-btn:active:not(:disabled) { transform: scale(0.93); }
    .send-btn:disabled              { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 17px; height: 17px; }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 480px) {
      .header      { padding: 11px 16px; }
      .brand-sub   { display: none; }
      .messages    { padding: 16px 12px 6px; }
      .input-area  { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  </div>
  <div>
    <div class="brand">ParentEase AI</div>
    <div class="brand-sub">Asisten parenting cerdas</div>
  </div>
  <div class="status">
    <span class="status-dot"></span>
    Online
  </div>
</header>

<!-- Messages -->
<div class="messages" id="messages">
  <div class="empty" id="empty">
    <div class="empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="empty-title">Halo! Ada yang bisa dibantu?</div>
    <div class="empty-sub">Tanyakan seputar ASI, MPASI, vaksinasi, atau tumbuh kembang si kecil.</div>
    <div class="chips">
      <button class="chip" onclick="useChip(this)">Kapan mulai MPASI?</button>
      <button class="chip" onclick="useChip(this)">Jadwal vaksinasi bayi</button>
      <button class="chip" onclick="useChip(this)">Posisi menyusui yang benar</button>
      <button class="chip" onclick="useChip(this)">Berat normal bayi 6 bulan</button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-inner">
    <div class="input-shell">
      <textarea
        id="input"
        placeholder="Tanya seputar ASI, MPASI, tumbuh kembang…"
        rows="1"
        autofocus
      ></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Kirim (Enter)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');

  let typing = null;

  /* ── Auto-resize textarea ─────────────────────────────────── */
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = `${inputEl.scrollHeight}px`;
  });

  /* ── Keyboard: Enter sends, Shift+Enter = newline ─────────── */
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ── Helpers ──────────────────────────────────────────────── */
  function now() {
    return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatAI(raw) {
    let text = escapeHtml(raw);
    // Bold (**text**)
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Horizontal rule (---)
    text = text.replace(/^---$/gm, '<hr>');
    // Split by double newline into paragraphs
    return text
      .split(/\n{2,}/)
      .map(para => {
        const lines = para.split('\n');
        // If all non-empty lines start with "- " treat as a list
        const listItems = lines.filter(l => l.trim());
        if (listItems.length > 0 && listItems.every(l => /^[-•]\s/.test(l.trim()))) {
          const lis = listItems
            .map(l => `<li>${l.trim().replace(/^[-•]\s/, '')}</li>`)
            .join('');
          return `<ul>${lis}</ul>`;
        }
        return `<p>${lines.join('<br>')}</p>`;
      })
      .join('');
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /* ── Append a message bubble ──────────────────────────────── */
  function appendMessage(role, text, sources = []) {
    emptyEl.style.display = 'none';

    const isUser = role === 'user';
    const row    = document.createElement('div');
    row.className = `row ${isUser ? 'user' : ''}`;

    // Avatar
    const av = document.createElement('div');
    av.className = `avatar ${isUser ? 'user' : 'ai'}`;
    av.textContent = isUser ? 'U' : '✦';

    // Bubble
    const wrap   = document.createElement('div');
    wrap.className = 'wrap';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${isUser ? 'user-bubble' : 'ai-bubble'}`;
    if (isUser) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = formatAI(text);
    }

    wrap.appendChild(bubble);

    // Source chips — only for AI messages that have sources
    if (!isUser && sources.length > 0) {
      const srcRow = document.createElement('div');
      srcRow.className = 'sources';

      const label = document.createElement('span');
      label.className = 'source-label';
      label.textContent = 'Sumber:';
      srcRow.appendChild(label);

      // book icon SVG (inline, reused per chip)
      const bookSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>`;

      for (const src of sources) {
        const chip = document.createElement('span');
        chip.className = 'source-chip';
        const pageText = src.page != null ? ` · Hal. ${src.page}` : '';
        chip.innerHTML = `${bookSVG}${src.title}${pageText}`;
        srcRow.appendChild(chip);
      }

      wrap.appendChild(srcRow);
    }

    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = now();

    wrap.appendChild(ts);
    row.appendChild(av);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    scrollBottom();
  }

  /* ── Typing indicator ─────────────────────────────────────── */
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row';

    const av = document.createElement('div');
    av.className = 'avatar ai';
    av.textContent = '✦';

    const bub = document.createElement('div');
    bub.className = 'typing-bubble';
    bub.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(av);
    row.appendChild(bub);
    messagesEl.appendChild(row);
    typing = row;
    scrollBottom();
  }

  function hideTyping() {
    typing?.remove();
    typing = null;
  }

  /* ── Suggestion chips ─────────────────────────────────────── */
  function useChip(el) {
    inputEl.value = el.textContent.trim();
    inputEl.dispatchEvent(new Event('input'));
    sendMessage();
  }

  /* ── Send a message ───────────────────────────────────────── */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      hideTyping();
      appendMessage('assistant', data.response, data.sources ?? []);
    } catch (err) {
      hideTyping();
      appendMessage('assistant', `Maaf, terjadi kesalahan: ${err.message}. Silakan coba lagi.`);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
