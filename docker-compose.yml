services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: parentease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parentease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d parentease']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis Cache / Celery Broker
  redis:
    image: redis:7-alpine
    container_name: parentease-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parentease-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/parentease
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MCP_SERVER_URL: http://mcp:8001
      MCP_TIMEOUT_SECONDS: '30'
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MCP Tool Server
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parentease-mcp
    restart: unless-stopped
    command:
      [
        '/app/.venv/bin/uvicorn',
        'app.mcp_server:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8001',
        '--workers',
        '2',
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/parentease
      REDIS_URL: redis://redis:6379/0
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vite/React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: parentease-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: parentease-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
